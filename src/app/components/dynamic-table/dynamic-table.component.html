<div class="table-responsive">
  <table mat-table [dataSource]="dataSource" class="w-100">
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef class="mat-subtitle-1 f-s-14">
        {{ columnHeaders[column] }}
      </th>
      <td mat-cell *matCellDef="let element">
        <ng-container [ngSwitch]="column">
          <span *ngSwitchCase="'id'">{{ element.id }}</span>
          <div *ngSwitchCase="'users'" class="d-flex align-items-center">
            <img src="../../../assets/images/profile//user-1.jpg" alt="users" width="60" class="rounded-7" />
            <div class="m-l-16 product-title">
              <h6 class="mat-subtitle-1 text-truncate-2 f-s-14 lh-sm">
                {{ element.username }}
              </h6>
            </div>
          </div>
          <span *ngSwitchCase="'email'">{{ element.email }}</span>
          <span *ngSwitchCase="'status'">
              <ng-container *ngTemplateOutlet="statusTemplate; context: { row: element }"></ng-container>
          </span>
          <div *ngSwitchCase="'menu'">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon button with a vertical three dot icon">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" xPosition="before">
              <ng-container *ngFor="let action of actions">
                <a
                  href="javascript:void(0)"
                  class="d-flex align-items-center text-decoration-none p-y-10 p-x-16 mat-body-1 gap-8"
                  (click)="onAction(action.label, element)"
                >
                  <i-tabler [name]="action.icon" class="icon-18"></i-tabler>
                  <span>{{ action.label }}</span>
                </a>
              </ng-container>
            </mat-menu>
          </div>
        </ng-container>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
<ng-template #statusTemplate let-row="row">
  <button mat-raised-button (click)="onAction('Edit', row)" [color]="row.status ? 'primary' : 'warn'">
    {{ row.status ? 'Active' : 'Inactive' }}
  </button>
</ng-template>
