<mat-card class="cardWithShadow theme-card">
    <mat-card-header>
      <mat-card-title class="m-b-0">Add Shop</mat-card-title>
    </mat-card-header>
  
    <mat-card-content class="b-t-1">
      <form (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-lg-6">
            <mat-label class="f-w-600 m-b-8 d-block">Shop Name</mat-label>
            <mat-form-field appearance="outline" class="w-100">
              <input matInput [(ngModel)]="shop_name" name="shop_name" placeholder="Enter shop name" />
            </mat-form-field>
          </div>
  
          <div class="col-lg-6">
            <mat-label class="f-w-600 m-b-8 d-block">Location</mat-label>
            <mat-form-field appearance="outline" class="w-100">
              <input matInput [(ngModel)]="location" name="location" placeholder="Enter location" />
            </mat-form-field>
          </div>
  
          <div class="col-lg-6">
            <mat-label class="f-w-600 m-b-8 d-block">Status</mat-label>
            <mat-form-field appearance="outline" class="w-100">
              <input matInput [(ngModel)]="status" name="status" placeholder="approved/pending" />
            </mat-form-field>
          </div>
        </div>
  
        <div class="m-t-12">
          <button mat-flat-button color="primary" class="m-r-8" type="submit">Submit</button>
          <button mat-stroked-button color="warn" type="reset">Cancel</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
