<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img src="./assets/images/logos/logo.svg" class="align-middle m-2" alt="logo" />
            </a>
          </div>

          <div class="row m-t-24 custom-row">
            <div class="col-6">
              <button mat-stroked-button class="w-100">
                <div class="d-flex align-items-center">
                  <img src="/assets/images/svgs/google-icon.svg" alt="google" width="16" class="m-r-8" />
                  <span class="d-none d-lg-block">Sign in with Google</span>
                </div>
              </button>
            </div>
            <div class="col-6">
              <button mat-stroked-button class="w-100 d-flex align-items-center">
                <div class="d-flex align-items-center">
                  <img src="/assets/images/svgs/facebook-icon.svg" alt="facebook" width="40" class="m-r-4" />
                  <span class="d-none d-lg-block">Sign in with FB</span>
                </div>
              </button>
            </div>
          </div>

          <div class="or-border m-t-30">or sign up with</div>

       <form class="m-t-30" [formGroup]="form" (ngSubmit)="submit()">
  <!-- First Name -->
  <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">First Name</mat-label>
  <mat-form-field appearance="outline" class="w-100" color="primary">
    <input matInput placeholder="First Name" formControlName="firstName" />
  </mat-form-field>

  <!-- Last Name -->
  <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Last Name</mat-label>
  <mat-form-field appearance="outline" class="w-100" color="primary">
    <input matInput placeholder="Last Name" formControlName="lastName" />
  </mat-form-field>

  <!-- Email -->
  <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email Address</mat-label>
  <mat-form-field appearance="outline" class="w-100" color="primary">
    <input matInput placeholder="Email" type="email" formControlName="email" />
  </mat-form-field>

  <!-- Password -->
  <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
  <mat-form-field appearance="outline" class="w-100" color="primary">
    <input matInput placeholder="Password" type="password" formControlName="password" />
  </mat-form-field>

  <!-- Phone -->
  <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Phone Number</mat-label>
  <mat-form-field appearance="outline" class="w-100" color="primary">
    <input matInput placeholder="Phone Number" formControlName="phoneNumber" />
  </mat-form-field>

  <!-- Submit Button -->
  <button mat-flat-button color="primary" class="w-100" type="submit">
    Sign Up
  </button>
</form>
          <span class="d-block f-w-500 text-center m-t-24">Already have an Account?

            <a [routerLink]="['/authentication/login']" class="text-decoration-none text-primary f-w-500 f-s-14">
              Sign In</a>
          </span>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
